name: Dựng lại trang mỗi đêm

on:
  schedule:
    # 00:10 giờ Việt Nam (Asia/Ho_Chi_Minh, UTC+7) = 17:10 UTC ngày hôm trước
    - cron: "10 17 * * *"
  workflow_dispatch: {}

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cài gói
        run: pnpm install --frozen-lockfile

      - name: Chạy kiểm thử
        run: pnpm test

      - name: Dựng trang web
        run: pnpm build
        working-directory: web

      # TODO: thêm bước triển khai khi đã nối Vercel
